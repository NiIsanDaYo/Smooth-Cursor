<!doctype html>
<html><head><meta charset="utf-8"><title>Cursor sheet</title>
<style>
  body { margin: 0; font: 12px system-ui; background: #f3f3f3; }
  .row { display: flex; flex-wrap: wrap; gap: 0; padding: 12px; }
  .row.dark { background: #1d1f22; color: #ccc; }
  .row.mid { background: #7a8a99; }
  figure { margin: 0; width: 92px; height: 92px; display: grid; place-items: center; position: relative; }
  figcaption { position: absolute; bottom: 2px; font-size: 10px; opacity: .6; }
  canvas { image-rendering: pixelated; }
  .hot { position: absolute; width: 1px; height: 1px; background: red; }
</style></head>
<body>
<div id="out"></div>
<script src="../src/shared/constants.js"></script>
<script src="../src/shared/cursors.js"></script>
<script>
  const SC = self.SmoothCursor;
  const dpr = devicePixelRatio;
  const out = document.getElementById('out');
  const scales = (new URLSearchParams(location.search).get('s') || '1,1.5,2').split(',').map(Number);
  for (const bg of ['', 'dark', 'mid']) {
    for (const s of scales) {
      const row = document.createElement('div'); row.className = 'row ' + bg;
      for (const k of SC.CURSOR_KINDS) {
        const sp = SC.getSprite(k, s * dpr, 300);
        const f = document.createElement('figure');
        const c = document.createElement("canvas"); c.width = sp.canvas.width; c.height = sp.canvas.height; c.getContext("2d").drawImage(sp.canvas, 0, 0); c.style.width = c.width / dpr + 'px'; c.style.height = c.height / dpr + 'px';
        const wrap = document.createElement('div'); wrap.style.position = 'relative';
        wrap.appendChild(c);
        if (!bg) { const h = document.createElement('div'); h.className = 'hot'; h.style.left = sp.hx / dpr + 'px'; h.style.top = sp.hy / dpr + 'px'; wrap.appendChild(h); }
        f.appendChild(wrap);
        const cap = document.createElement('figcaption'); cap.textContent = k + ' ' + s + 'x'; f.appendChild(cap);
        row.appendChild(f);
      }
      out.appendChild(row);
    }
  }
</script>
</body></html>
