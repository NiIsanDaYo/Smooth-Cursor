<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Smooth Cursor</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <h1 class="mark"><img src="../../icons/icon32.png" width="20" height="20" alt="">Smooth Cursor</h1>
  <label class="switch">
    <input type="checkbox" id="enabled" role="switch" data-i18n-aria="power">
    <span class="track" aria-hidden="true"></span>
  </label>
</header>

<section class="controls">
  <div class="field">
    <label for="smoothing" data-i18n="smoothing"></label>
    <output id="smoothingOut" for="smoothing"></output>
    <input type="range" id="smoothing" min="0" max="100" step="1">
  </div>
  <div class="field">
    <label for="blur" data-i18n="blur"></label>
    <output id="blurOut" for="blur">
      <svg class="streak" viewBox="0 0 26 8" aria-hidden="true">
        <defs><linearGradient id="streakFade"><stop offset="0" stop-color="currentColor" stop-opacity="0"/><stop offset="1" stop-color="currentColor"/></linearGradient></defs>
        <rect id="streakBar" y="2.6" height="2.8" rx="1.4" fill="url(#streakFade)"/>
        <circle cx="22.5" cy="4" r="2.3" fill="currentColor"/>
      </svg>
      <span id="blurVal"></span>
    </output>
    <input type="range" id="blur" min="0" max="50" step="1" aria-describedby="blurHint">
    <p class="note" id="blurHint" data-i18n="blurHint"></p>
  </div>
  <div class="field">
    <label for="size" data-i18n="size"></label>
    <output id="sizeOut" for="size"></output>
    <input type="range" id="size" min="1" max="3" step="0.25">
  </div>
  <div class="field row">
    <div>
      <label for="predict" data-i18n="predict"></label>
      <p class="note" id="predictHint" data-i18n="predictHint"></p>
    </div>
    <label class="switch">
      <input type="checkbox" id="predict" role="switch" aria-describedby="predictHint">
      <span class="track" aria-hidden="true"></span>
    </label>
  </div>
</section>

<footer class="site" id="site">
  <div class="field row" id="siteRow">
    <label for="siteOn" id="siteLabel"></label>
    <label class="switch">
      <input type="checkbox" id="siteOn" role="switch">
      <span class="track" aria-hidden="true"></span>
    </label>
  </div>
  <p class="note" id="siteNote" hidden></p>
  <button class="reload" id="reload" type="button" hidden data-i18n="reloadTab"></button>
</footer>

<script src="../shared/constants.js"></script>
<script src="popup.js"></script>
</body>
</html>
